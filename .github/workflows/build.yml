name: Build

on:
  push:
    branches: [main]
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'private-extensions.lock.json'
  pull_request:
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'private-extensions.lock.json'
  workflow_dispatch:
    inputs:
      android_release:
        description: 'Build Android with the official release certificate (requires Secrets)'
        type: boolean
        default: true
      ios:
        description: 'Also build an unsigned iOS arm64 IPA (requires your own signing)'
        type: boolean
        default: false
      implementation:
        description: 'Official private implementation or public basic implementation'
        type: choice
        options: [official, public]
        default: official

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'
  USE_PRIVATE_EXTENSIONS: ${{ github.repository == 'TG-Twilight/c001apk' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || inputs.implementation != 'public') }}

defaults:
  run:
    working-directory: apps/flutter

jobs:
  checks:
    name: Offline checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      build_date: ${{ steps.version.outputs.date }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate official build branch
        if: github.repository == 'TG-Twilight/c001apk' && github.event_name == 'workflow_dispatch' && inputs.implementation != 'public' && github.ref != 'refs/heads/main'
        run: echo 'Official implementation builds require the main branch'; exit 1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve build date (UTC+8)
        id: version
        run: dart tool/update_build_date.dart
      - run: flutter pub get --enforce-lockfile
      - name: Assemble official implementation
        if: env.USE_PRIVATE_EXTENSIONS == 'true'
        uses: ./.github/actions/private-extensions
        with:
          private-key: ${{ secrets.PRIVATE_EXTENSIONS_DEPLOY_KEY }}
      - name: Analyze (errors and warnings fail; existing info lints remain visible)
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Offline regression tests
        run: flutter test --no-pub

  desktop:
    name: ${{ matrix.platform }} x86_64 release
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2022
          - platform: linux
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - name: Sync build date
        run: dart tool/update_build_date.dart ${{ needs.checks.outputs.build_date }}
      - run: flutter pub get --enforce-lockfile
      - name: Assemble official implementation
        if: env.USE_PRIVATE_EXTENSIONS == 'true'
        uses: ./.github/actions/private-extensions
        with:
          private-key: ${{ secrets.PRIVATE_EXTENSIONS_DEPLOY_KEY }}
      - run: flutter build ${{ matrix.platform }} --release --no-pub
      - name: Package Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ((Select-String -Path pubspec.yaml -Pattern '^version: ').Line -replace '^version: ', '').Trim()
          $runtime = 'build/windows/x64/runner/Release'
          foreach ($file in @('c001apk.exe', 'flutter_windows.dll', 'data/icudtl.dat', 'data/app.so', 'data/flutter_assets/assets/icon/icon.png', 'data/flutter_assets/fonts/MaterialIcons-Regular.otf')) {
            if (!(Test-Path -LiteralPath "$runtime/$file")) { throw "Missing runtime file: $file" }
          }
          foreach ($asset in Get-ChildItem -LiteralPath assets/emojis -File) {
            $bundled = "$runtime/data/flutter_assets/assets/emojis/$($asset.Name)"
            if (!(Test-Path -LiteralPath $bundled) -or (Get-FileHash -LiteralPath $asset.FullName).Hash -ne (Get-FileHash -LiteralPath $bundled).Hash) {
              throw "Missing or different emoji asset: $($asset.Name)"
            }
          }
          New-Item -ItemType Directory -Force -Path build/distribution | Out-Null
          $archive = "c001apk-$version-windows-x86_64.zip"
          Compress-Archive -Path "$runtime/*" -DestinationPath "build/distribution/$archive"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "build/distribution/$archive").Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -Encoding ascii -Path build/distribution/SHA256SUMS.txt
      - name: Package Linux runtime
        if: runner.os == 'Linux'
        run: |
          version=$(sed -n 's/^version: //p' pubspec.yaml | tr -d '\r')
          bundle=build/linux/x64/release/bundle
          test -x "$bundle/c001apk"
          test -f "$bundle/lib/libflutter_linux_gtk.so"
          test -f "$bundle/lib/libapp.so"
          test -f "$bundle/data/icudtl.dat"
          mkdir -p build/distribution
          archive="c001apk-$version-linux-x86_64.tar.gz"
          tar -czf "build/distribution/$archive" -C "$bundle" .
          (cd build/distribution && sha256sum "$archive" > SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: c001apk-${{ matrix.platform }}-x86_64-release
          path: apps/flutter/build/distribution/*
          if-no-files-found: error
          retention-days: 14

  android-debug:
    name: Android debug (project certificate)
    # Pull requests skip Android signing; never expose signing Secrets to PR code.
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || !inputs.android_release)
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      KEY_ALIAS: '秋风のとおり道'
      EXPECTED_CERT_SHA256: 'EA385AFC82E19824EEA8A8868ED365DF03E9886BBBA33E47E1E04B43EC65CB67'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Select JDK and install Android SDK packages
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358'
      - name: Sync build date
        run: dart tool/update_build_date.dart ${{ needs.checks.outputs.build_date }}
      - run: flutter pub get --enforce-lockfile
      - name: Assemble official implementation
        if: env.USE_PRIVATE_EXTENSIONS == 'true'
        uses: ./.github/actions/private-extensions
        with:
          private-key: ${{ secrets.PRIVATE_EXTENSIONS_DEPLOY_KEY }}
      - name: Restore and verify project keystore
        env:
          KEYSTORE: ${{ runner.temp }}/c001apk-signing/release.jks
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          REVIA_KS_PASS: ${{ secrets.REVIA_KS_PASS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64 Secret'; exit 1; }
          test -n "$REVIA_KS_PASS" || { echo 'Missing REVIA_KS_PASS Secret'; exit 1; }
          umask 077
          mkdir -p "$(dirname "$KEYSTORE")"
          printf 'KEYSTORE=%s\n' "$KEYSTORE" >> "$GITHUB_ENV"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          keytool -exportcert -keystore "$KEYSTORE" -alias "$KEY_ALIAS" -storepass:env REVIA_KS_PASS -file "$RUNNER_TEMP/c001apk-signing/cert.der"
          actual=$(sha256sum "$RUNNER_TEMP/c001apk-signing/cert.der" | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]')
          test "$actual" = "$EXPECTED_CERT_SHA256" || { echo 'Unexpected release signing certificate'; exit 1; }
      - name: Build project-signed debug APKs
        env:
          REVIA_KS_PASS: ${{ secrets.REVIA_KS_PASS }}
        run: flutter build apk --debug --split-per-abi --no-pub
      - name: Verify debug APK certificates
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            report=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "build/app/outputs/flutter-apk/app-$abi-debug.apk")
            actual=$(printf '%s\n' "$report" | tr -d '\r' | sed -nE 's/^.*certificate SHA-256 digest: ([[:xdigit:]]{64})$/\1/p' | tr '[:lower:]' '[:upper:]' | sort -u)
            test "$actual" = "$EXPECTED_CERT_SHA256" || { echo "Unexpected debug APK certificate: $abi"; exit 1; }
          done
      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/c001apk-signing/release.jks" "$RUNNER_TEMP/c001apk-signing/cert.der"
          rmdir "$RUNNER_TEMP/c001apk-signing" 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: c001apk-android-debug
          path: apps/flutter/build/app/outputs/flutter-apk/*-debug.apk
          if-no-files-found: error
          retention-days: 7

  android-release:
    name: Android signed release (three ABIs)
    if: github.event_name == 'workflow_dispatch' && inputs.android_release
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      KEY_ALIAS: '秋风のとおり道'
      EXPECTED_CERT_SHA256: 'EA385AFC82E19824EEA8A8868ED365DF03E9886BBBA33E47E1E04B43EC65CB67'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Select JDK and install Android SDK packages
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358'
      - name: Sync build date
        run: dart tool/update_build_date.dart ${{ needs.checks.outputs.build_date }}
      - run: flutter pub get --enforce-lockfile
      - name: Assemble official implementation
        if: env.USE_PRIVATE_EXTENSIONS == 'true'
        uses: ./.github/actions/private-extensions
        with:
          private-key: ${{ secrets.PRIVATE_EXTENSIONS_DEPLOY_KEY }}
      - name: Restore and verify release keystore
        env:
          KEYSTORE: ${{ runner.temp }}/c001apk-signing/release.jks
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          REVIA_KS_PASS: ${{ secrets.REVIA_KS_PASS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64 Secret'; exit 1; }
          test -n "$REVIA_KS_PASS" || { echo 'Missing REVIA_KS_PASS Secret'; exit 1; }
          umask 077
          mkdir -p "$(dirname "$KEYSTORE")"
          printf 'KEYSTORE=%s\n' "$KEYSTORE" >> "$GITHUB_ENV"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          keytool -exportcert -keystore "$KEYSTORE" -alias "$KEY_ALIAS" -storepass:env REVIA_KS_PASS -file "$RUNNER_TEMP/c001apk-signing/cert.der"
          actual=$(sha256sum "$RUNNER_TEMP/c001apk-signing/cert.der" | cut -d ' ' -f 1 | tr '[:lower:]' '[:upper:]')
          test "$actual" = "$EXPECTED_CERT_SHA256" || { echo 'Unexpected release signing certificate'; exit 1; }
      - name: Build signed APKs
        env:
          REVIA_KS_PASS: ${{ secrets.REVIA_KS_PASS }}
        # Release-mode plugin registration must exclude dev-only native plugins.
        run: |
          flutter build apk --release --split-per-abi
          git diff --exit-code -- pubspec.lock
      - name: Verify APK signatures and package each ABI
        run: |
          version=$(sed -n 's/^version: //p' pubspec.yaml | tr -d '\r')
          mkdir -p build/distribution
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="build/app/outputs/flutter-apk/app-$abi-release.apk"
            report=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk")
            actual=$(printf '%s\n' "$report" | tr -d '\r' | sed -nE 's/^.*certificate SHA-256 digest: ([[:xdigit:]]{64})$/\1/p' | tr '[:lower:]' '[:upper:]' | sort -u)
            test "$actual" = "$EXPECTED_CERT_SHA256" || { echo "Unexpected APK certificate: $abi"; exit 1; }
            python3 - "$apk" "$abi" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              abis = {name.split('/')[1] for name in apk.namelist() if name.endswith('/libapp.so')}
              uncompressed = [entry.filename for entry in apk.infolist()
                              if entry.filename.startswith('lib/') and entry.filename.endswith('.so')
                              and entry.compress_type != zipfile.ZIP_DEFLATED]
          if abis != {sys.argv[2]}:
              raise SystemExit(f'Unexpected APK ABIs: {abis}')
          if uncompressed:
              raise SystemExit(f'Native libraries must be compressed: {uncompressed}')
          PY
            cp "$apk" "build/distribution/c001apk-$version-android-$abi.apk"
          done
          (cd build/distribution && sha256sum ./*.apk > SHA256SUMS.txt)
      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/c001apk-signing/release.jks" "$RUNNER_TEMP/c001apk-signing/cert.der"
          rmdir "$RUNNER_TEMP/c001apk-signing" 2>/dev/null || true
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: c001apk-android-arm64-v8a-release
          path: apps/flutter/build/distribution/*-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: c001apk-android-armeabi-v7a-release
          path: apps/flutter/build/distribution/*-armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload x86_64 APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: c001apk-android-x86_64-release
          path: apps/flutter/build/distribution/*-x86_64.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload APK checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: c001apk-android-release-checksums
          path: apps/flutter/build/distribution/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS arm64 unsigned IPA
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    needs: checks
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Sync build date
        run: dart tool/update_build_date.dart ${{ needs.checks.outputs.build_date }}
      - run: flutter pub get --enforce-lockfile
      - name: Assemble official implementation
        if: env.USE_PRIVATE_EXTENSIONS == 'true'
        uses: ./.github/actions/private-extensions
        with:
          private-key: ${{ secrets.PRIVATE_EXTENSIONS_DEPLOY_KEY }}
      - run: flutter build ios --release --no-codesign --no-pub
      - name: Check arm64 binary
        run: |
          xcrun lipo build/ios/iphoneos/Runner.app/Runner -verify_arch arm64
          plutil -extract CFBundleIdentifier raw build/ios/iphoneos/Runner.app/Info.plist
          plutil -extract CFBundleShortVersionString raw build/ios/iphoneos/Runner.app/Info.plist
          plutil -extract CFBundleVersion raw build/ios/iphoneos/Runner.app/Info.plist
          test ! -f build/ios/iphoneos/Runner.app/embedded.mobileprovision
      - name: Package unsigned IPA
        run: |
          version=$(sed -n 's/^version: //p' pubspec.yaml | tr -d '\r')
          distribution="$PWD/build/distribution"
          mkdir -p "$distribution/ios-staging/Payload"
          ditto build/ios/iphoneos/Runner.app "$distribution/ios-staging/Payload/Runner.app"
          archive="c001apk-$version-ios-arm64-unsigned.ipa"
          (cd "$distribution/ios-staging" && ditto -c -k --keepParent Payload "../$archive")
          unzip -t "$distribution/$archive"
          (cd "$distribution" && shasum -a 256 "$archive" > SHA256SUMS.txt)
          echo 'Unsigned arm64 IPA: sign it with your own Apple certificate and provisioning profile before installation. No iPhone runtime acceptance has been performed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: c001apk-ios-arm64-unsigned
          path: |
            apps/flutter/build/distribution/*-ios-arm64-unsigned.ipa
            apps/flutter/build/distribution/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
